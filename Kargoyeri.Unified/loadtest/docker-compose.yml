# k6 + Grafana + InfluxDB stack
# Usage:
#   cd loadtest && docker compose up -d
#   docker compose run --rm k6 run -e BASE_URL=http://host.docker.internal:5000 /scripts/baseline.js
#   open http://localhost:3000 (admin/admin)

version: '3.8'

services:
  influxdb:
    image: influxdb:1.8
    ports: ["8086:8086"]
    environment:
      INFLUXDB_DB: k6

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning

  k6:
    image: grafana/k6:latest
    network_mode: host
    volumes:
      - ./:/scripts
    environment:
      - K6_OUT=influxdb=http://localhost:8086/k6

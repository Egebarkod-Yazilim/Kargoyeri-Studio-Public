# Kargoyeri.Studio — site konfigurasyonu
# --------------------------------------------------------------------------
# 1) HTTP -> HTTPS yonlendirmesi
# 2) HTTPS terminasyon + reverse proxy
# 3) Login ve API endpoint'lerine ek rate limiting
# --------------------------------------------------------------------------

# === HTTP -> HTTPS ===
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Let's Encrypt http-01 challenge icin (gerekirse)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# === HTTPS ===
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name _;

    # === SSL ===
    # Sertifikalar ./nginx/certs/ icine yerlestirilmeli (volume mount).
    # Production: Let's Encrypt veya kurumsal CA sertifikasi.
    ssl_certificate           /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key       /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # === Guvenlik header'lari (uygulama da gonderiyor; nginx burada da
    # yedekler — proxy arkasindaki uygulamadan gelen header'larin yerine gecmez,
    # Studio kendi CSP'sini gonderir, biz de eksik kalanlari tamamlariz). ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"  always;
    add_header X-Frame-Options           "DENY"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # === Reverse proxy ortak ayarlar ===
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";

    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;

    # === Login: brute-force cinde ek koruma (uygulama icinde de var) ===
    location ~* ^/Access/Login {
        limit_req       zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass      http://studio_backend;
    }

    # === REST API ===
    location /api/ {
        limit_req       zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass      http://studio_backend;
    }

    # === Healthcheck — disariya kapali ===
    location ~* ^/health(/.*)?$ {
        # Sadece dahili monitoring icin: gerekirse IP allow listesi ekleyin
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass      http://studio_backend;
        access_log      off;
    }

    # === Statik dosyalar (cache) ===
    location ~* ^/(css|js|images|lib|favicon\.ico) {
        proxy_pass      http://studio_backend;
        proxy_cache_valid 200 1h;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # === Default ===
    location / {
        proxy_pass      http://studio_backend;
    }

    # Hata sayfalari
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}

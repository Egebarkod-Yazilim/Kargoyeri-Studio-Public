# Kargoyeri.Studio — global nginx ayarlari
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Loglama
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # Performans
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Gzip
    gzip                 on;
    gzip_vary            on;
    gzip_min_length      1024;
    gzip_proxied         any;
    gzip_comp_level      6;
    gzip_types           text/plain text/css application/json application/javascript
                         application/xml application/xml+rss text/javascript image/svg+xml;

    # Buyuk yuk dosyalari (CSV import) icin upper limit
    client_max_body_size 50m;
    client_body_buffer_size 1m;
    client_body_timeout  60s;
    client_header_timeout 30s;

    # Rate limit zone'lari (login + API icin)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;

    # Upstream
    upstream studio_backend {
        server studio:8080;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
